spring:
  application:
    name: social-cross-poster
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:socialcrossposter}
    username: ${DB_USER:socialcrossposter}
    password: ${DB_PASSWORD:}
    hikari:
      # Conservative pooling on a single NAS instance (ADR-009).
      maximum-pool-size: 5
  flyway:
    enabled: true
  servlet:
    multipart:
      # UC-13 media uploads: capped at the app.media.max-bytes limit (10 MB default).
      max-file-size: 10MB
      max-request-size: 12MB
    session:
      cookie:
        http-only: true
        same-site: lax

server:
  port: 8080
  # Forwarded headers are accepted only from configured trusted proxies
  # (ADR-005); the baseline deployment terminates TLS in front without forwarding.
  forward-headers-strategy: none

management:
  # Management/Actuator stays on a separate internal/loopback listener (ADR-005).
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health

app:
  # Public origin of this installation, used for provider callbacks (ADR-008).
  base-url: ${APP_BASE_URL:http://localhost:8080}
  # APP_USER / APP_PASSWORD_HASH are intentionally not defaulted here: missing
  # owner credentials fail startup closed (ADR-005).
  # APP_SECRETS_KEY (base64, 32 bytes, AES-256) and APP_SECRETS_KEY_ID (default
  # "v1") likewise have no default: workspace secrets cannot be encrypted or
  # decrypted without an externally supplied versioned key, so startup fails
  # closed without them (ADR-007). The key is supplied via the protected
  # environment/secret files, never stored in the database or this file.
  # Durable retry worker (UC-07, ADR-015): APP_WORKER_ENABLED=false disables the
  # scheduled worker (tests drive DeliveryJobService.runDueJobs manually).
  worker:
    enabled: ${APP_WORKER_ENABLED:true}
    poll-interval-ms: ${APP_WORKER_POLL_INTERVAL_MS:5000}
    initial-delay-ms: ${APP_WORKER_INITIAL_DELAY_MS:2000}
    lease-ttl-seconds: ${APP_WORKER_LEASE_TTL_SECONDS:60}
    max-attempts: ${APP_WORKER_MAX_ATTEMPTS:4}
    backoff-base-seconds: ${APP_WORKER_BACKOFF_BASE_SECONDS:60}
    backoff-cap-seconds: ${APP_WORKER_BACKOFF_CAP_SECONDS:3600}
    instance-id: ${APP_WORKER_INSTANCE_ID:}
  media:
    # Private source media only (ADR-008, UC-13): local disk, authenticated download,
    # never a permanent public URL. In the baseline compose deployment this is a
    # dedicated volume (/data/media).
    dir: ${APP_MEDIA_DIR:data/media}
    max-bytes: ${APP_MEDIA_MAX_BYTES:10485760}
  import-grants:
    # UC-13 fourth slice: short-lived revocable import grants (ADR-008 step 3).
    # Signed grant URLs are generated from the configured origin and signed with the
    # versioned secrets key (ADR-007) — never hard-coded; a missing key fails startup
    # closed. TTL is bounded; fetches per grant are rate-limited.
    base-url: ${app.base-url}
    signing-key: ${APP_SECRETS_KEY:}
    signing-key-id: ${APP_SECRETS_KEY_ID:v1}
    ttl-minutes: ${APP_IMPORT_GRANTS_TTL_MINUTES:30}
    max-fetches-per-window: ${APP_IMPORT_GRANTS_MAX_FETCHES_PER_WINDOW:10}
    window-seconds: ${APP_IMPORT_GRANTS_WINDOW_SECONDS:600}
  notify:
    # UC-12 second + third slices: external webhook and SMTP notification channels
    # (arc42 section 8 SSRF rules apply to both). APP_NOTIFY_WORKER_ENABLED=false
    # disables the scheduled outbox worker (tests drive
    # NotificationDeliveryService.runDue manually).
    worker-enabled: ${APP_NOTIFY_WORKER_ENABLED:true}
    poll-interval-ms: ${APP_NOTIFY_POLL_INTERVAL_MS:5000}
    initial-delay-ms: ${APP_NOTIFY_INITIAL_DELAY_MS:2000}
    # UC-12 step 4: at most three total delivery attempts per (event, channel).
    max-attempts: ${APP_NOTIFY_MAX_ATTEMPTS:3}
    backoff-base-seconds: ${APP_NOTIFY_BACKOFF_BASE_SECONDS:60}
    backoff-cap-seconds: ${APP_NOTIFY_BACKOFF_CAP_SECONDS:3600}
    connect-timeout-ms: ${APP_NOTIFY_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${APP_NOTIFY_READ_TIMEOUT_MS:10000}
    # Deployment operator allow-list for intentional internal outbound targets
    # (comma-separated hosts, e.g. 127.0.0.1 for a local receiver or SMTP relay).
    # Empty by default: only https URLs to public hosts pass the webhook guard and
    # only encrypted SMTP modes pass the SMTP guard; localhost, cloud metadata
    # endpoints and private/loopback/link-local ranges are always denied. Plain
    # http webhooks and unencrypted SMTP (port 25 / TLS NONE) are only accepted
    # for allow-listed hosts.
    allowed-internal-hosts: ${APP_NOTIFY_ALLOWED_INTERNAL_HOSTS:}
  experimental:
    # UC-14 / ADR-010: personal WhatsApp Status and Signal are feasibility-gated
    # experiments, off by default — the core release has no bridge dependency.
    # When enabled they are listed with a permanent "experimental / unofficial"
    # label but stay unavailable until a bridge passes the ADR-010 feasibility
    # probe. WhatsApp Business is permanently excluded and never offered.
    # The locally protected pairing/setup path lives at /w/{slug}/experiments
    # (owner login + CSRF on the loopback-only deployment — no public pairing
    # UI); it stays closed until flag + record + wired bridge adapter all hold.
    enabled: ${APP_EXPERIMENTAL_ENABLED:false}
    # Dated ADR-010 feasibility records, one entry per experimental platform key,
    # e.g. APP_EXPERIMENTAL_FEASIBILITY_SIGNAL="2026-11-17 local probe record …".
    # Empty by default (no bridge has passed the probe). Excluded, non-experimental
    # or blank entries fail startup closed. A record alone does not open the gate:
    # the target also needs a wired bridge adapter in this build.
    feasibility: {}
