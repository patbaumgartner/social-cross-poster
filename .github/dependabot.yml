version: 2
updates:
  # Docs lint tooling (package.json / package-lock.json at the root).
  # A maven ecosystem entry is added when the application scaffolding lands.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Zurich
    open-pull-requests-limit: 10
    reviewers:
      - patbaumgartner
    assignees:
      - patbaumgartner
    commit-message:
      prefix: deps(node)
      include: scope
    labels:
      - dependencies
      - node
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Zurich
    open-pull-requests-limit: 5
    reviewers:
      - patbaumgartner
    assignees:
      - patbaumgartner
    commit-message:
      prefix: ci
      include: scope
    labels:
      - dependencies
      - github-actions
